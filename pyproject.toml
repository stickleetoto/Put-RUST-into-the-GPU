[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ferrum-compute"
version = "0.1.0"
description = "Python bindings for Put RUST into the GPU"
requires-python = ">=3.9"
license = "MIT"

[tool.maturin]
manifest-path = "crates/ferrum-python/Cargo.toml"
features = ["python"]
module-name = "ferrum_compute"
