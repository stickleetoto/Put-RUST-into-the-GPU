[package]
name = "ferrum-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[lib]
name = "ferrum_compute"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]


[dependencies]
ferrum-cpu = { path = "../ferrum-cpu" }
pyo3 = { version = "0.27", optional = true, features = ["extension-module"] }
